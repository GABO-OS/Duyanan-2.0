spring.application.name=backend
server.port=${PORT:8080}

# ── MySQL Database (Local / Cloud) ───────────────────────────
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/duyanan_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── CORS (allow frontend to call the backend) ─────────────────
spring.web.cors.allowed-origins=*

# ── JWT Configuration ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:DuyananRestaurantSuperSecretKeyForJWT2026!MustBe32+Chars}
jwt.expiration=86400000

# ── Mail / SMTP (Gmail) ───────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:duyanankainan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Multipart File Upload Limits ──────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── Frontend URL (used for password reset links) ─────────
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
