spring.application.name=backend
server.port=${PORT:8080}

# ── MySQL Database (Local / Cloud) ───────────────────────────
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/duyanan_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ── JPA / Hibernate (Disable SQL spam & permit DDL override) ──────
# NOTE FOR NEXT DEVELOPER: In Render environment variables, set:
# SPRING_JPA_HIBERNATE_DDL_AUTO=none
# This prevents Hibernate from querying every table schema over remote JDBC on every wake-up!
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# ── HikariCP Connection Pool (Optimized for low-resource Cloud MySQL) ──
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000

# ── CORS (allow frontend to call the backend) ─────────────────
spring.web.cors.allowed-origins=*

# ── JWT Configuration ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:DuyananRestaurantSuperSecretKeyForJWT2026!MustBe32+Chars}
jwt.expiration=86400000

# ── Mail / SMTP (Gmail) ───────────────────────────────────────
# NOTE FOR NEXT DEVELOPER / AI:
# For Forgot Password to work in production, you MUST set MAIL_PASSWORD in Render Environment:
# MAIL_PASSWORD=<16-character-google-app-password> (generate via Google Account -> Security -> 2-Step Verification -> App passwords)
# Do NOT use the personal Google account password!
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:duyanankainan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Multipart File Upload Limits ──────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── Frontend URL (used for password reset links) ─────────
# NOTE FOR NEXT DEVELOPER: In Render Environment, set FRONTEND_URL to your live URL
# e.g., FRONTEND_URL=https://duyanan-restaurant.onrender.com
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
